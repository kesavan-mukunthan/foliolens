<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}FolioLens — Flexicap{% endblock %}</title>
<style>
  :root { color-scheme: light; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    margin: 0; color: #1a1a1a; background: #fff; line-height: 1.5;
  }
  a { color: #1a5fb4; }
  header.site-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0.75rem 1.5rem; border-bottom: 1px solid #ddd; flex-wrap: wrap; gap: 0.5rem;
  }
  header.site-header .brand { font-weight: 600; text-decoration: none; color: #1a1a1a; }
  header.site-header .nav-controls { display: flex; align-items: center; gap: 1rem; font-size: 0.85rem; color: #555; }
  main { max-width: 62rem; margin: 0 auto; padding: 1.5rem; }
  h1, h2, h3 { font-weight: 600; }
  table { border-collapse: collapse; width: 100%; margin-bottom: 1.5rem; font-size: 0.9rem; }
  th, td { border: 1px solid #ddd; padding: 0.4rem 0.6rem; text-align: right; }
  th:first-child, td:first-child { text-align: left; }
  thead th { background: #f5f5f5; }
  th[data-sortable="true"] { cursor: pointer; user-select: none; }
  th[data-sortable="true"]::after { content: ""; margin-left: 0.25rem; color: #888; }
  th[data-dir="asc"]::after { content: "▲"; }
  th[data-dir="desc"]::after { content: "▼"; }
  td.greyed { color: #999; }
  /* Footnote references (D2b percentile convention, D2c t-stat suppression):
     a small superscript marker in a header/cell, and the matching note below
     the table. Muted so it reads as apparatus, not data. */
  sup.fn-ref { color: #1a5fb4; font-size: 0.7em; }
  p.fn-note { font-size: 0.78rem; color: #555; margin: -0.8rem 0 1.5rem; }
  p.fn-note sup.fn-ref { color: #555; }
  /* Excess-return colouring only (amendment 4) — plain classes, not inline
     style, so a later print stylesheet (F3) can leave colour alone instead
     of having to strip an inline attribute; do not scope these to a
     screen-only media query. Background fill (not font colour); white text
     for contrast against both. A print stylesheet will need
     print-color-adjust: exact for the fill to survive to paper — noted for
     F3, not handled here. */
  .excess-pos { background-color: #1a7f37; color: #fff; }
  .excess-neg { background-color: #c4560c; color: #fff; }
  .chart-block { margin: 1.5rem 0; }
  .chart-block svg { max-width: 100%; height: auto; }
  .tier-fallback { display: inline-block; background: #fff3cd; color: #664d03; padding: 0.15rem 0.5rem; border-radius: 0.25rem; font-size: 0.8rem; }
  .commentary { background: #f9f9f9; border: 1px solid #e5e5e5; padding: 1rem; border-radius: 0.4rem; }
  footer.site-footer { border-top: 1px solid #ddd; padding: 1rem 1.5rem; font-size: 0.78rem; color: #666; }
  footer.site-footer p { max-width: 62rem; margin: 0.3rem auto; }

  /* Print / PDF (F3, spec-flexicap-page §4/§7-F3) — WeasyPrint renders this
     same layout, no separate PDF template. A4 with sane margins; nav/sort-JS
     hidden (they're either non-interactive or actively broken on paper);
     tables and chart figures avoid splitting mid-block across a page break;
     the footer (footnote + disclaimer) repeats on every printed page via
     @page rather than living once at the end of the document. */
  @media print {
    header.site-header .nav-controls { display: none; }
  }
  @page {
    size: A4;
    margin: 2cm 1.5cm;
    @bottom-center {
      content: element(pdf-footer);
    }
  }
  .pdf-footer { display: none; }
  @media print {
    .pdf-footer {
      display: block;
      position: running(pdf-footer);
      font-size: 0.65rem;
      color: #666;
      max-width: 18cm;
      line-height: 1.3;
    }
    .pdf-footer p { margin: 0.15rem 0; }
    table, .chart-block { break-inside: avoid; page-break-inside: avoid; }
    /* Background fills (excess-return cells) are dropped by default in most
       print pipelines, incl. WeasyPrint — without this, a PDF with
       invisible white-on-white excess columns is a build failure, not a
       style nit (spec-flexicap-page §7-F3). */
    .excess-pos, .excess-neg {
      print-color-adjust: exact;
      -webkit-print-color-adjust: exact;
    }
  }
</style>
</head>
<body>
<div class="pdf-footer">
  <p>{{ footnote }}</p>
  <p>{{ disclaimer }}</p>
</div>
<header class="site-header">
  <a class="brand" href="{{ root_prefix }}index.html">FolioLens — Flexicap</a>
  <div class="nav-controls">
    <span class="as-of">Data as of {{ as_of }}</span>
    <select onchange="if (this.value) { location.href = this.value; }">
      <option value="">Jump to fund…</option>
      {% for f in nav_funds %}
      <option value="{{ root_prefix }}funds/{{ f.amfi_code }}.html"{% if f.amfi_code == current_amfi_code %} selected{% endif %}>{{ f.scheme_name }}</option>
      {% endfor %}
    </select>
  </div>
</header>
<main>
{% block content %}{% endblock %}
</main>
<footer class="site-footer">
  <p class="footnote">{{ footnote }}</p>
  <p class="disclaimer">{{ disclaimer }}</p>
</footer>
<script src="{{ root_prefix }}static/sort.js"></script>
</body>
</html>
