name: ci
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-groups
      - run: uv run ruff check .
      - run: uv run mypy --strict src
      - run: uv run pytest
      - name: TESTS.md drift check
        run: |
          uv run python scripts/gen_tests_md.py
          git diff --exit-code tests/TESTS.md
      - name: Capability inventory drift check
        run: |
          uv run python scripts/gen_inventory.py
          git diff --exit-code ARCHITECTURE.md
